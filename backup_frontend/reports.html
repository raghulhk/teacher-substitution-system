<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Substitution Reports - TSS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      color: #333;
    }

    .container {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar Styles */
    .sidebar {
      width: 260px;
      background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
      padding: 30px 20px;
      color: white;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      box-shadow: 2px 0 15px rgba(102, 126, 234, 0.2);
    }

    .sidebar h2 {
      font-size: 28px;
      margin-bottom: 40px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .sidebar button {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 10px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
      text-align: left;
      border-left: 3px solid transparent;
    }

    .sidebar button:hover {
      background: rgba(255, 255, 255, 0.2);
      border-left-color: #fff;
      transform: translateX(5px);
    }

    /* Main Content */
    .main-content {
      margin-left: 260px;
      flex: 1;
      padding: 40px;
      overflow-y: auto;
    }

    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 32px;
      font-weight: 700;
    }

    .page-subtitle {
      color: #999;
      margin-bottom: 30px;
      font-size: 14px;
    }

    /* Action Bar */
    .action-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .print-btn {
      padding: 12px 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .print-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .print-btn:active {
      transform: translateY(0);
    }

    /* Table Styles */
    .table-section {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow-x: auto;
    }

    .table-section h2 {
      color: #333;
      margin-bottom: 25px;
      font-size: 20px;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    table thead {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    table th {
      padding: 15px;
      text-align: left;
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    table td {
      padding: 15px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    table tbody tr {
      transition: all 0.2s ease;
    }

    table tbody tr:hover {
      background-color: #f9fafb;
      box-shadow: inset 0 0 0 1px rgba(102, 126, 234, 0.1);
    }

    table tbody tr:last-child td {
      border-bottom: none;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 15px;
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 16px;
      margin-bottom: 5px;
    }

    /* Loading State */
    .loading {
      text-align: center;
      padding: 40px;
      color: #667eea;
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Status Badge */
    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: capitalize;
    }

    .status-badge.completed {
      background-color: #d4edda;
      color: #155724;
    }

    .status-badge.pending {
      background-color: #fff3cd;
      color: #856404;
    }

    .status-badge.cancelled {
      background-color: #f8d7da;
      color: #721c24;
    }

    /* Message */
    #message {
      margin-bottom: 20px;
      padding: 15px;
      border-radius: 8px;
      font-weight: 500;
      display: none;
      border-left: 4px solid;
      animation: slideIn 0.3s ease;
    }

    #message.success {
      background-color: #d4edda;
      color: #155724;
      border-left-color: #28a745;
      display: block;
    }

    #message.error {
      background-color: #f8d7da;
      color: #721c24;
      border-left-color: #f5c6cb;
      display: block;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive Design */
    @media (max-width: 1024px) {
      .sidebar {
        width: 220px;
      }

      .main-content {
        margin-left: 220px;
        padding: 30px;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: -260px;
        height: 100vh;
        z-index: 1000;
        width: 260px;
        transition: left 0.3s ease;
      }

      .sidebar.active {
        left: 0;
      }

      .main-content {
        margin-left: 0;
        padding: 20px;
      }

      .menu-toggle {
        display: block;
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 999;
        background: #667eea;
        border: none;
        color: white;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 24px;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
      }

      h1 {
        font-size: 24px;
      }

      .table-section {
        padding: 20px;
      }

      table th,
      table td {
        padding: 10px;
        font-size: 12px;
      }

      .print-btn {
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      .table-section {
        padding: 15px;
      }

      table {
        font-size: 12px;
      }

      table th,
      table td {
        padding: 8px 5px;
      }

      h1 {
        font-size: 20px;
      }

      .table-section h2 {
        font-size: 18px;
      }
    }

    @media print {
      .sidebar,
      .action-bar,
      .menu-toggle {
        display: none;
      }

      .main-content {
        margin-left: 0;
        padding: 0;
      }

      body {
        background: white;
      }

      .table-section {
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="sidebar" id="sidebar">
    <h2>TSS</h2>
    <button onclick="navigateTo('/dashboard.html')">Dashboard</button>
    <button onclick="navigateTo('/teachers.html')">Teachers</button>
    <button onclick="navigateTo('/timetable.html')">Timetable</button>
    <button onclick="navigateTo('/substitution.html')">Substitutions</button>
    <button onclick="navigateTo('/reports.html')">Reports</button>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="main-content">
    <h1>Substitution Reports</h1>
    <p class="page-subtitle">View all substitution records and reports</p>

    <div id="message"></div>

    <div class="action-bar">
      <button class="print-btn" onclick="window.print()">
        🖨️ Print Report
      </button>
    </div>

    <div class="table-section">
      <h2>Substitution Records</h2>
      
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Day</th>
            <th>Period</th>
            <th>Class</th>
            <th>Absent Teacher</th>
            <th>Substitute Teacher</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="reportTable">
          <tr>
            <td colspan="7" class="loading"><div class="spinner"></div> Loading reports...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const API = "http://localhost:3000";

  // Check authentication
  if (!localStorage.getItem("token")) {
    window.location.href = "/";
  }

  function getToken() {
    return localStorage.getItem("token");
  }

  function navigateTo(path) {
    window.location.href = path;
  }

  function logout() {
    localStorage.removeItem("token");
    window.location.href = "/";
  }

  function showMessage(text, type) {
    const message = document.getElementById("message");
    message.innerText = text;
    message.className = type;
    
    if (type === "success") {
      setTimeout(() => {
        message.innerHTML = "";
        message.className = "";
      }, 4000);
    }
  }

  function getStatusBadge(status) {
    const statusLower = status.toLowerCase();
    return `<span class="status-badge ${statusLower}">${status}</span>`;
  }

  async function loadReports() {
    try {
      const response = await fetch(`${API}/api/substitution`);
      
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      
      const data = await response.json();

      const table = document.getElementById("reportTable");
      
      if (!data || data.length === 0) {
        table.innerHTML = `
          <tr>
            <td colspan="7" class="empty-state">
              <div class="empty-state-icon">📋</div>
              <p>No substitution reports found</p>
              <p style="font-size: 12px;">Substitution records will appear here once they are created</p>
            </td>
          </tr>
        `;
        return;
      }

      table.innerHTML = "";
      data.forEach((item) => {
        const statusBadge = getStatusBadge(item.status || "Pending");
        table.innerHTML += `
          <tr>
            <td>${item.date || "-"}</td>
            <td>${item.day || "-"}</td>
            <td>${item.period || "-"}</td>
            <td>${item.class_name || "-"}</td>
            <td>${item.absent_teacher_name || "-"}</td>
            <td>${item.substitute_teacher_name || "-"}</td>
            <td>${statusBadge}</td>
          </tr>
        `;
      });
    } catch (error) {
      console.error("[v0] Error loading reports:", error);
      document.getElementById("reportTable").innerHTML = `
        <tr>
          <td colspan="7" class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <p>Error loading reports</p>
            <p style="font-size: 12px;">Please try again later</p>
          </td>
        </tr>
      `;
      showMessage("Error loading reports. Please try again.", "error");
    }
  }

  // Load reports on page load
  loadReports();
</script>

</body>
</html>
