<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Substitution System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-container">
    <div class="login-background">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
    </div>

    <div class="login-card">
      <div class="login-header">
        <div class="logo-icon">📚</div>
        <h1>Teacher Substitution System</h1>
        <p class="subtitle">Admin Portal</p>
      </div>

      <form class="login-form" onsubmit="return false;">
        <div class="form-group">
          <label for="username">Username</label>
          <input 
            type="text" 
            id="username" 
            placeholder="Enter your username"
            class="form-input"
          >
          <span class="input-focus-line"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            placeholder="Enter your password"
            class="form-input"
          >
          <span class="input-focus-line"></span>
        </div>

        <button type="button" class="login-btn" onclick="login()">
          <span class="btn-text">Sign In</span>
          <span class="btn-icon">→</span>
        </button>
      </form>

      <p id="loginMessage" class="login-message"></p>

      <div class="login-footer">
        <p>© 2024 Education Admin System</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
