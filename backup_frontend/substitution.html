<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Substitution Management</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #667eea;
      --primary-dark: #764ba2;
      --secondary: #f093fb;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --bg-dark: #1f2937;
      --bg-light: #f9fafb;
      --text-dark: #111827;
      --text-light: #6b7280;
      --border: #e5e7eb;
      --card-bg: #ffffff;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: var(--text-dark);
    }

    .container {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px 20px;
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.2);
      z-index: 1000;
    }

    .sidebar h2 {
      font-size: 28px;
      margin-bottom: 40px;
      font-weight: 700;
      letter-spacing: 1px;
      background: rgba(255, 255, 255, 0.2);
      padding: 10px 15px;
      border-radius: 8px;
      text-align: center;
    }

    .sidebar button {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 10px;
      border: none;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.3s ease;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar button:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateX(5px);
    }

    .sidebar button:before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--secondary);
      border-radius: 50%;
    }

    /* Main Content */
    .main-content {
      margin-left: 250px;
      flex: 1;
      padding: 40px 30px;
      background: var(--bg-light);
    }

    h1 {
      color: var(--text-dark);
      font-size: 32px;
      margin-bottom: 30px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    h1:before {
      content: '';
      width: 6px;
      height: 30px;
      background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
      border-radius: 3px;
    }

    h2 {
      color: var(--text-dark);
      font-size: 22px;
      margin: 40px 0 20px 0;
      font-weight: 600;
    }

    /* Form Card */
    .form-card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      margin-bottom: 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      align-items: end;
      transition: all 0.3s ease;
    }

    .form-card:hover {
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dark);
    }

    select,
    input[type="date"],
    input[type="number"] {
      padding: 12px 15px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s ease;
      font-family: inherit;
      background: white;
      color: var(--text-dark);
    }

    select:focus,
    input[type="date"]:focus,
    input[type="number"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    select:hover,
    input[type="date"]:hover,
    input[type="number"]:hover {
      border-color: var(--primary-dark);
    }

    button {
      padding: 12px 30px;
      border: none;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    /* Message Styles */
    #message {
      grid-column: 1 / -1;
      padding: 15px 20px;
      border-radius: 8px;
      font-weight: 500;
      display: none;
      animation: slideIn 0.3s ease;
    }

    #message.show {
      display: block;
    }

    #message.success {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      border-left: 4px solid var(--success);
    }

    #message.error {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border-left: 4px solid var(--danger);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Table Styles */
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    thead {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
    }

    th {
      padding: 18px;
      text-align: left;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    td {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      color: var(--text-dark);
    }

    tbody tr {
      transition: all 0.3s ease;
    }

    tbody tr:hover {
      background: linear-gradient(90deg, rgba(102, 126, 234, 0.05) 0%, rgba(240, 147, 251, 0.05) 100%);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    /* Status Badge */
    .status-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
      text-transform: capitalize;
    }

    .status-badge.pending {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
    }

    .status-badge.assigned {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
    }

    .status-badge.completed {
      background: rgba(59, 130, 246, 0.2);
      color: #3b82f6;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-light);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 15px;
      opacity: 0.6;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-light);
    }

    .spinner {
      border: 3px solid rgba(102, 126, 234, 0.2);
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        padding: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .sidebar h2 {
        margin-bottom: 0;
      }

      .sidebar-nav {
        display: none;
      }

      .sidebar-nav.active {
        display: flex;
        flex-direction: column;
        width: 100%;
        margin-top: 20px;
      }

      .main-content {
        margin-left: 0;
        padding: 20px 15px;
      }

      h1 {
        font-size: 24px;
      }

      .form-card {
        grid-template-columns: 1fr;
      }

      table {
        font-size: 12px;
      }

      th, td {
        padding: 12px 10px;
      }
    }

    @media (max-width: 480px) {
      .main-content {
        padding: 15px 10px;
      }

      h1 {
        font-size: 20px;
        margin-bottom: 20px;
      }

      .form-card {
        padding: 20px;
      }

      select, input {
        font-size: 16px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="sidebar">
    <h2>TSS</h2>
    <div class="sidebar-nav">
      <button onclick="location.href='/dashboard.html'">Dashboard</button>
      <button onclick="location.href='/teachers.html'">Teachers</button>
      <button onclick="location.href='/timetable.html'">Timetable</button>
      <button onclick="location.href='/substitution.html'">Substitutions</button>
      <button onclick="location.href='/reports.html'">Reports</button>    </div>
  </div>

  <div class="main-content">
    <h1>Substitution Assignment</h1>

    <div class="form-card">
      <div class="form-group">
        <label for="teacherSelect">Select Absent Teacher</label>
        <select id="teacherSelect"></select>
      </div>

      <div class="form-group">
        <label for="date">Date</label>
        <input type="date" id="date">
      </div>

      <div class="form-group">
        <label for="day">Day</label>
        <select id="day">
          <option>Monday</option>
          <option>Tuesday</option>
          <option>Wednesday</option>
          <option>Thursday</option>
          <option>Friday</option>
        </select>
      </div>

      <div class="form-group">
        <label for="period">Period</label>
        <input type="number" id="period" placeholder="Enter period number">
      </div>

      <button onclick="assignSubstitute()">Assign Substitute</button>

      <div id="message"></div>
    </div>

    <h2>Substitution History</h2>

    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Absent Teacher</th>
          <th>Substitute Teacher</th>
          <th>Class</th>
          <th>Period</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="substitutionTable"></tbody>
    </table>
  </div>
</div>

<script>
  const API = window.location.origin;

  async function loadTeachers() {
    try {
      const response = await fetch(`${API}/api/teachers`);
      const teachers = await response.json();

      const select = document.getElementById("teacherSelect");
      select.innerHTML = '<option value="">-- Select a teacher --</option>';

      teachers.forEach((teacher) => {
        select.innerHTML += `
          <option value="${teacher.id}">
            ${teacher.name}
          </option>
        `;
      });
    } catch (error) {
      console.error("[v0] Error loading teachers:", error);
      showMessage("Error loading teachers", "error");
    }
  }

  async function loadSubstitutions() {
    try {
      const response = await fetch(`${API}/api/substitution`);
      const data = await response.json();

      const table = document.getElementById("substitutionTable");

      if (!data || data.length === 0) {
        table.innerHTML = `
          <tr>
            <td colspan="6" style="text-align: center; padding: 40px;">
              <div class="empty-state">
                <div class="empty-state-icon">📋</div>
                <p>No substitutions yet</p>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      table.innerHTML = "";

      data.forEach((sub) => {
        const statusClass = sub.status.toLowerCase().replace(" ", "-");
        table.innerHTML += `
          <tr>
            <td>${new Date(sub.date).toLocaleDateString()}</td>
            <td>${sub.absent_teacher_name}</td>
            <td>${sub.substitute_teacher_name}</td>
            <td>${sub.class_name}</td>
            <td>${sub.period}</td>
            <td>
              <span class="status-badge ${statusClass}">
                ${sub.status}
              </span>
            </td>
          </tr>
        `;
      });
    } catch (error) {
      console.error("[v0] Error loading substitutions:", error);
      showMessage("Error loading substitutions", "error");
    }
  }

  async function assignSubstitute() {
    const teacherId = document.getElementById("teacherSelect").value;
    const date = document.getElementById("date").value;
    const day = document.getElementById("day").value;
    const period = document.getElementById("period").value;

    if (!teacherId || !date || !day || !period) {
      showMessage("Please fill in all fields", "error");
      return;
    }

    try {
      const body = {
        absent_teacher_id: teacherId,
        date: date,
        day: day,
        period: period,
      };

      const response = await fetch(`${API}/api/substitution/assign`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
           "Authorization": `Bearer ${localStorage.getItem("token")}`,
        },
        body: JSON.stringify(body),
      });

      const result = await response.json();

      if (response.ok) {
        showMessage(`✓ Substitute Assigned: ${result.substitute_teacher}`, "success");
        document.getElementById("teacherSelect").value = "";
        document.getElementById("date").value = "";
        document.getElementById("period").value = "";
        loadSubstitutions();
      } else {
        showMessage(result.message || "Failed to assign substitute", "error");
      }
    } catch (error) {
      console.error("[v0] Error assigning substitute:", error);
      showMessage("Error assigning substitute", "error");
    }
  }

  function showMessage(text, type) {
    const message = document.getElementById("message");
    message.textContent = text;
    message.className = `show ${type}`;

    setTimeout(() => {
      message.classList.remove("show");
    }, 4000);
  }

  // Initialize
  loadTeachers();
  loadSubstitutions();
</script>

</body>
</html>
