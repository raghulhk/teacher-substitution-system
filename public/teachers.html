<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Management - TSS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      color: #333;
    }

    .container {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar Styles */
    .sidebar {
      width: 260px;
      background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
      padding: 30px 20px;
      color: white;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      box-shadow: 2px 0 15px rgba(102, 126, 234, 0.2);
    }

    .sidebar h2 {
      font-size: 28px;
      margin-bottom: 40px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .sidebar button {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 10px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
      text-align: left;
      border-left: 3px solid transparent;
    }

    .sidebar button:hover {
      background: rgba(255, 255, 255, 0.2);
      border-left-color: #fff;
      transform: translateX(5px);
    }

    /* Main Content */
    .main-content {
      margin-left: 260px;
      flex: 1;
      padding: 40px;
      overflow-y: auto;
    }

    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 32px;
      font-weight: 700;
    }

    .page-subtitle {
      color: #999;
      margin-bottom: 30px;
      font-size: 14px;
    }

    /* Form Card */
    .form-card {
      background: white;
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 40px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border-top: 4px solid #667eea;
      transition: all 0.3s ease;
    }

    .form-card:hover {
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }

    .form-card h2 {
      color: #333;
      margin-bottom: 25px;
      font-size: 20px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
      font-size: 14px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"] {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      background-color: #f9fafb;
    }

    .form-inputs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-inputs-grid .form-group {
      margin-bottom: 0;
    }

    .form-full {
      grid-column: 1 / -1;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      margin-top: 25px;
    }

    button.add-btn {
      flex: 1;
      padding: 12px 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button.add-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    button.add-btn:active {
      transform: translateY(0);
    }

    button.reset-btn {
      padding: 12px 30px;
      background: #f0f0f0;
      color: #333;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    button.reset-btn:hover {
      background: #e0e0e0;
    }

    #message {
      margin-top: 15px;
      padding: 12px 15px;
      border-radius: 8px;
      font-weight: 500;
      display: none;
      border-left: 4px solid;
      animation: slideIn 0.3s ease;
    }

    #message.success {
      background-color: #d4edda;
      color: #155724;
      border-left-color: #28a745;
      display: block;
    }

    #message.error {
      background-color: #f8d7da;
      color: #721c24;
      border-left-color: #f5c6cb;
      display: block;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Table Styles */
    .table-section {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow-x: auto;
    }

    .table-section h2 {
      color: #333;
      margin-bottom: 25px;
      font-size: 20px;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    table thead {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    table th {
      padding: 15px;
      text-align: left;
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    table td {
      padding: 15px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    table tbody tr {
      transition: all 0.2s ease;
    }

    table tbody tr:hover {
      background-color: #f9fafb;
      box-shadow: inset 0 0 0 1px rgba(102, 126, 234, 0.1);
    }

    table tbody tr:last-child td {
      border-bottom: none;
    }

    .delete-btn {
      padding: 8px 16px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .delete-btn:hover {
      background: #ff5252;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
    }

    .delete-btn:active {
      transform: translateY(0);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 15px;
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 16px;
      margin-bottom: 5px;
    }

    /* Loading State */
    .loading {
      text-align: center;
      padding: 40px;
      color: #667eea;
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Responsive Design */
    @media (max-width: 1024px) {
      .sidebar {
        width: 220px;
      }

      .main-content {
        margin-left: 220px;
        padding: 30px;
      }

      .form-inputs-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: -260px;
        height: 100vh;
        z-index: 1000;
        width: 260px;
        transition: left 0.3s ease;
      }

      .sidebar.active {
        left: 0;
      }

      .main-content {
        margin-left: 0;
        padding: 20px;
      }

      .menu-toggle {
        display: block;
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 999;
        background: #667eea;
        border: none;
        color: white;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 24px;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
      }

      h1 {
        font-size: 24px;
      }

      .form-card,
      .table-section {
        padding: 20px;
      }

      table th,
      table td {
        padding: 10px;
        font-size: 12px;
      }

      .btn-group {
        flex-direction: column;
      }

      button.add-btn,
      button.reset-btn {
        width: 100%;
      }

      .delete-btn {
        padding: 6px 12px;
        font-size: 11px;
      }
    }

    @media (max-width: 480px) {
      .table-section {
        padding: 15px;
      }

      table {
        font-size: 12px;
      }

      table th,
      table td {
        padding: 8px 5px;
      }

      h1 {
        font-size: 20px;
      }

      .form-card h2,
      .table-section h2 {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="sidebar" id="sidebar">
    <h2>TSS</h2>
    <button onclick="navigateTo('/dashboard.html')">Dashboard</button>
    <button onclick="navigateTo('/teachers.html')">Teachers</button>
    <button onclick="navigateTo('/timetable.html')">Timetable</button>
    <button onclick="navigateTo('/substitutions.html')">Substitutions</button>
    <button onclick="navigateTo('/reports.html')">Reports</button>
  </div>

  <div class="main-content">
    <h1>Teacher Management</h1>
    <p class="page-subtitle">Add, view, and manage teacher information</p>

    <div class="form-card">
      <h2>Add New Teacher</h2>
      
      <div class="form-inputs-grid">
        <div class="form-group">
          <label for="name">Teacher Name</label>
          <input id="name" type="text" placeholder="Enter full name">
        </div>
        
        <div class="form-group">
          <label for="department">Department</label>
          <input id="department" type="text" placeholder="e.g., Mathematics">
        </div>
        
        <div class="form-group">
          <label for="subject">Subject</label>
          <input id="subject" type="text" placeholder="e.g., Algebra">
        </div>
        
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="teacher@school.com">
        </div>
        
        <div class="form-group">
          <label for="phone">Phone</label>
          <input id="phone" type="tel" placeholder="+1 (555) 123-4567">
        </div>
      </div>

      <div class="btn-group">
        <button class="add-btn" onclick="addTeacher()">Add Teacher</button>
        <button class="reset-btn" onclick="resetForm()">Clear Form</button>
      </div>

      <div id="message"></div>
    </div>

    <div class="table-section">
      <h2>Teacher List</h2>
      
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Department</th>
            <th>Subject</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="teacherTable">
          <tr>
            <td colspan="7" class="loading"><div class="spinner"></div> Loading teachers...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const API = "http://localhost:3000";

  function getToken() {
    return localStorage.getItem("token");
  }

  function navigateTo(path) {
    window.location.href = path;
  }

  function resetForm() {
    document.getElementById("name").value = "";
    document.getElementById("department").value = "";
    document.getElementById("subject").value = "";
    document.getElementById("email").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("message").innerHTML = "";
    document.getElementById("message").className = "";
  }

  function showMessage(text, type) {
    const message = document.getElementById("message");
    message.innerText = text;
    message.className = type;
    
    if (type === "success") {
      setTimeout(() => {
        message.innerHTML = "";
        message.className = "";
      }, 4000);
    }
  }

  async function loadTeachers() {
    try {
      const response = await fetch(`${API}/api/teachers`);
      const teachers = await response.json();

      const table = document.getElementById("teacherTable");
      
      if (!teachers || teachers.length === 0) {
        table.innerHTML = `
          <tr>
            <td colspan="7" class="empty-state">
              <div class="empty-state-icon">📚</div>
              <p>No teachers found</p>
              <p style="font-size: 12px;">Add your first teacher using the form above</p>
            </td>
          </tr>
        `;
        return;
      }

      table.innerHTML = "";
      teachers.forEach((teacher) => {
        table.innerHTML += `
          <tr>
            <td>${teacher.id}</td>
            <td>${teacher.name}</td>
            <td>${teacher.department || "-"}</td>
            <td>${teacher.subject || "-"}</td>
            <td>${teacher.email || "-"}</td>
            <td>${teacher.phone || "-"}</td>
            <td>
              <button class="delete-btn" onclick="deleteTeacher(${teacher.id})">
                Delete
              </button>
            </td>
          </tr>
        `;
      });
    } catch (error) {
      console.error("[v0] Error loading teachers:", error);
      document.getElementById("teacherTable").innerHTML = `
        <tr>
          <td colspan="7" class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <p>Error loading teachers</p>
            <p style="font-size: 12px;">Please try again later</p>
          </td>
        </tr>
      `;
    }
  }

  async function addTeacher() {
    const name = document.getElementById("name").value.trim();
    const department = document.getElementById("department").value.trim();
    const subject = document.getElementById("subject").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();

    if (!name) {
      showMessage("Please enter teacher name", "error");
      return;
    }

    const teacher = {
      name,
      department,
      subject,
      email,
      phone,
    };

    try {
      const response = await fetch(`${API}/api/teachers`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${getToken()}`,
        },
        body: JSON.stringify(teacher),
      });

      const data = await response.json();

      if (response.ok) {
        showMessage(data.message || "Teacher added successfully!", "success");
        resetForm();
        loadTeachers();
      } else {
        showMessage(data.message || "Error adding teacher", "error");
      }
    } catch (error) {
      console.error("[v0] Error adding teacher:", error);
      showMessage("An error occurred. Please try again.", "error");
    }
  }

  async function deleteTeacher(id) {
    const confirmDelete = confirm("Are you sure you want to delete this teacher?");
    if (!confirmDelete) return;

    try {
      const response = await fetch(`${API}/api/teachers/${id}`, {
        method: "DELETE",
        headers: {
          Authorization: `Bearer ${getToken()}`,
        },
      });

      const data = await response.json();
      
      if (response.ok) {
        showMessage(data.message || "Teacher deleted successfully!", "success");
      } else {
        alert(data.message || "Error deleting teacher");
      }

      loadTeachers();
    } catch (error) {
      console.error("[v0] Error deleting teacher:", error);
      alert("An error occurred while deleting the teacher.");
    }
  }

  // Load teachers on page load
  loadTeachers();
</script>

</body>
</html>
