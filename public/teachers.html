<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachers Management - Teacher Substitution System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 0 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .nav-brand {
            font-size: 24px;
            font-weight: 700;
            color: white;
            text-decoration: none;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 30px;
            align-items: center;
        }

        .nav-menu a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 8px 12px;
            border-radius: 6px;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            color: white;
            background: rgba(255, 255, 255, 0.15);
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* Main Content */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-top: 4px solid #667eea;
        }

        .header h1 {
            color: #2d3561;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            color: #a0a9d1;
            font-size: 14px;
        }

        /* Card */
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-top: 4px solid #667eea;
        }

        .card h2 {
            color: #2d3561;
            margin-bottom: 20px;
            font-size: 20px;
        }

        /* Form Styles */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: #2d3561;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-start;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #2d3561;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .btn-danger {
            padding: 8px 16px;
            background: #ff6b6b;
            color: white;
            font-size: 12px;
        }

        .btn-danger:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }

        .btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Message */
        .alert {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Table */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
            color: #555;
        }

        tbody tr:hover {
            background: #f5f5f5;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .empty-state p {
            margin: 5px 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-menu {
                gap: 15px;
            }

            .nav-menu a {
                font-size: 13px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 10px;
            }
        }

        @media (max-width: 480px) {
            .nav-container {
                gap: 15px;
            }

            .nav-brand {
                font-size: 18px;
            }

            .nav-menu {
                gap: 10px;
                font-size: 12px;
            }

            .nav-menu a {
                padding: 6px 8px;
            }

            .container {
                padding: 15px 10px;
            }

            .header, .card {
                padding: 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .card h2 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="dashboard.html" class="nav-brand">TSM System</a>
            <ul class="nav-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="teachers.html" class="active">Teachers</a></li>
                <li><a href="timetable.html">Timetable</a></li>
                <li><a href="substitution.html">Substitutions</a></li>
                <li><a href="reports.html">Reports</a></li>
                <li><button class="logout-btn" onclick="logout()">Logout</button></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Teachers Management</h1>
            <p>Add, view, and manage all teachers in the system</p>
        </div>

        <!-- Messages -->
        <div id="successMessage" class="alert alert-success"></div>
        <div id="errorMessage" class="alert alert-error"></div>

        <!-- Add Teacher Form -->
        <div class="card">
            <h2>Add New Teacher</h2>
            <form id="teacherForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" placeholder="Enter teacher name" required>
                    </div>

                    <div class="form-group">
                        <label for="department">Department *</label>
                        <select id="department" required>
                            <option value="">Select department</option>
                            <option value="BCA">BCA</option>
                            <option value="BCS">BCS</option>
                            <option value="BE">BE</option>
                            <option value="B.Tech">B.Tech</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject *</label>
                        <input type="text" id="subject" placeholder="e.g., Python, Mathematics" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" placeholder="teacher@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" placeholder="10 digit phone number" pattern="[0-9]{10}" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">Add Teacher</button>
                    <button type="reset" class="btn btn-secondary">Clear Form</button>
                </div>
            </form>
        </div>

        <!-- Teachers List -->
        <div class="card">
            <h2>Teachers List</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Subject</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="teachersTable">
                        <tr>
                            <td colspan="7" class="empty-state">
                                <div class="empty-state-icon">👨‍🏫</div>
                                <p>Loading teachers...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API = "";

        // Check token on page load
        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("token");
            if (!token) {
                window.location.href = "index.html";
                return;
            }

            loadTeachers();
            setupFormListener();
        });

        // Setup form listener
        function setupFormListener() {
            document.getElementById("teacherForm").addEventListener("submit", (e) => {
                e.preventDefault();
                addTeacher();
            });
        }

        // Load all teachers
        async function loadTeachers() {
            try {
                const response = await fetch(`${API}/api/teachers`);
                const teachers = await response.json();

                const table = document.getElementById("teachersTable");

                if (!teachers || teachers.length === 0) {
                    table.innerHTML = `
                        <tr>
                            <td colspan="7" class="empty-state">
                                <div class="empty-state-icon">📋</div>
                                <p>No teachers found</p>
                                <p style="font-size: 12px;">Add your first teacher using the form above</p>
                            </td>
                        </tr>
                    `;
                    return;
                }

                table.innerHTML = "";
                teachers.forEach((teacher) => {
                    table.innerHTML += `
                        <tr>
                            <td>${teacher.id}</td>
                            <td>${teacher.name || "-"}</td>
                            <td>${teacher.department || "-"}</td>
                            <td>${teacher.subject || "-"}</td>
                            <td>${teacher.email || "-"}</td>
                            <td>${teacher.phone || "-"}</td>
                            <td>
                                <button class="btn btn-danger" onclick="deleteTeacher(${teacher.id})">
                                    Delete
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("[v0] Error loading teachers:", error);
                document.getElementById("teachersTable").innerHTML = `
                    <tr>
                        <td colspan="7" class="empty-state">
                            <div class="empty-state-icon">⚠️</div>
                            <p>Error loading teachers</p>
                            <p style="font-size: 12px;">Please try again later</p>
                        </td>
                    </tr>
                `;
            }
        }

        // Add new teacher
        async function addTeacher() {
            const name = document.getElementById("name").value.trim();
            const department = document.getElementById("department").value;
            const subject = document.getElementById("subject").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();

            // Validation
            if (!name || !department || !subject || !email || !phone) {
                showError("All fields are required");
                return;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showError("Please enter a valid email");
                return;
            }

            if (!/^\d{10}$/.test(phone)) {
                showError("Phone number must be 10 digits");
                return;
            }

            const submitBtn = document.getElementById("submitBtn");
            submitBtn.classList.add("loading");
            submitBtn.innerHTML = '<span class="spinner"></span>Adding...';
            submitBtn.disabled = true;

            try {
                const token = localStorage.getItem("token");
                const response = await fetch(`${API}/api/teachers`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`,
                    },
                    body: JSON.stringify({
                        name: name,
                        department: department,
                        subject: subject,
                        email: email,
                        phone: phone,
                    }),
                });

                if (!response.ok) {
                    throw new Error("Failed to add teacher");
                }

                showSuccess("Teacher added successfully");
                document.getElementById("teacherForm").reset();
                loadTeachers();
            } catch (error) {
                console.error("[v0] Error adding teacher:", error);
                showError("Error adding teacher");
            } finally {
                submitBtn.classList.remove("loading");
                submitBtn.innerHTML = "Add Teacher";
                submitBtn.disabled = false;
            }
        }

        // Delete teacher
        async function deleteTeacher(id) {
            if (!confirm("Are you sure you want to delete this teacher?")) {
                return;
            }

            try {
                const token = localStorage.getItem("token");
                const response = await fetch(`${API}/api/teachers/${id}`, {
                    method: "DELETE",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                    },
                });

                if (!response.ok) {
                    throw new Error("Failed to delete teacher");
                }

                showSuccess("Teacher deleted successfully");
                loadTeachers();
            } catch (error) {
                console.error("[v0] Error deleting teacher:", error);
                showError("Error deleting teacher");
            }
        }

        // Show success message
        function showSuccess(message) {
            const successDiv = document.getElementById("successMessage");
            successDiv.textContent = message;
            successDiv.classList.add("show");

            setTimeout(() => {
                successDiv.classList.remove("show");
            }, 4000);
        }

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById("errorMessage");
            errorDiv.textContent = message;
            errorDiv.classList.add("show");

            setTimeout(() => {
                errorDiv.classList.remove("show");
            }, 4000);
        }

        // Logout function
        function logout() {
            localStorage.removeItem("token");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
