<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Substitution Management - Academy Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8f0fe 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 280px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 0;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 0 20px 30px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
        }

        .sidebar-header h1 {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .sidebar-header p {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .sidebar-nav {
            list-style: none;
        }

        .sidebar-nav li {
            margin-bottom: 0;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 15px 20px;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }

        .sidebar-nav a:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border-left-color: white;
        }

        .sidebar-nav a.active {
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
            border-left-color: #4dd0e1;
        }

        .sidebar-nav .icon {
            width: 20px;
            height: 20px;
            margin-right: 15px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 40px;
        }

        .header {
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .header p {
            font-size: 14px;
            color: #666;
        }

        /* Card Styles */
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            padding: 30px;
            margin-bottom: 30px;
            border-top: 4px solid #667eea;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .card-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
        }

        .card-title .icon {
            width: 24px;
            height: 24px;
            margin-right: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        /* Button Styles */
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
            padding: 8px 16px;
            font-size: 12px;
        }

        .btn-danger:hover {
            background: #ff5252;
        }

        /* Alert Messages */
        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        /* Table Styles */
        .table-responsive {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
        }

        table td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }

        table tbody tr:hover {
            background-color: #f8f9fa;
        }

        table tbody tr:last-child td {
            border-bottom: none;
        }

        /* Loading Spinner */
        .spinner {
            border: 3px solid rgba(102, 126, 234, 0.1);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state p {
            font-size: 16px;
            margin-top: 10px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }

            .main-content {
                margin-left: 200px;
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 12px;
            }

            table th, table td {
                padding: 10px;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                width: 60px;
            }

            .sidebar-header,
            .sidebar-nav a span {
                display: none;
            }

            .sidebar-nav a {
                justify-content: center;
            }

            .main-content {
                margin-left: 60px;
                padding: 15px;
            }

            .header h1 {
                font-size: 20px;
            }

            .card {
                padding: 15px;
            }

            table {
                font-size: 11px;
            }

            table th, table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>Academy</h1>
                <p>Management System</p>
            </div>
            <nav>
                <ul class="sidebar-nav">
                    <li>
                        <a href="dashboard.html">
                            <span class="icon">📊</span>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="teachers.html">
                            <span class="icon">👨‍🏫</span>
                            <span>Teachers</span>
                        </a>
                    </li>
                    <li>
                        <a href="timetable.html">
                            <span class="icon">📅</span>
                            <span>Timetable</span>
                        </a>
                    </li>
                    <li>
                        <a href="substitution.html" class="active">
                            <span class="icon">🔄</span>
                            <span>Substitutions</span>
                        </a>
                    </li>
                    <li>
                        <a href="reports.html">
                            <span class="icon">📈</span>
                            <span>Reports</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                <h1>Teacher Substitution Management</h1>
                <p>Assign substitute teachers for absent teachers</p>
            </div>

            <!-- Assign Substitute Form -->
            <div class="card">
                <div class="card-title">
                    <span class="icon">🔄</span>
                    Assign Substitute
                </div>

                <div id="alertContainer"></div>

                <form id="substitutionForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="absentTeacher">Absent Teacher</label>
                            <select id="absentTeacher" required>
                                <option value="">-- Select Absent Teacher --</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="date">Date</label>
                            <input type="date" id="date" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="day">Day</label>
                            <select id="day" required>
                                <option value="">-- Select Day --</option>
                                <option value="Monday">Monday</option>
                                <option value="Tuesday">Tuesday</option>
                                <option value="Wednesday">Wednesday</option>
                                <option value="Thursday">Thursday</option>
                                <option value="Friday">Friday</option>
                                <option value="Saturday">Saturday</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="period">Period Number</label>
                            <input type="number" id="period" min="1" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <span>Assign Substitute</span>
                    </button>
                </form>
            </div>

            <!-- Substitution Table -->
            <div class="card">
                <div class="card-title">
                    <span class="icon">📋</span>
                    Substitution Records
                </div>

                <div id="tableContainer" class="table-responsive">
                    <div class="loading-container">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = "";

        // Check for token
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'index.html';
                return;
            }

            loadTeachers();
            loadSubstitutions();

            document.getElementById('substitutionForm').addEventListener('submit', handleAssignSubstitute);
        });

        // Load teachers for dropdown
        async function loadTeachers() {
            try {
                const response = await fetch(`${API}/api/teachers`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load teachers');

                const teachers = await response.json();
                const select = document.getElementById('absentTeacher');

                teachers.forEach(teacher => {
                    const option = document.createElement('option');
                    option.value = teacher.id;
                    option.textContent = teacher.name;
                    select.appendChild(option);
                });
            } catch (error) {
                showAlert('Error loading teachers', 'error');
            }
        }

        // Load substitutions
        async function loadSubstitutions() {
            try {
                const response = await fetch(`${API}/api/substitution`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load substitutions');

                const substitutions = await response.json();
                displaySubstitutions(substitutions);
            } catch (error) {
                showAlert('Error loading substitutions', 'error');
                displaySubstitutions([]);
            }
        }

        // Display substitutions in table
        function displaySubstitutions(substitutions) {
            const container = document.getElementById('tableContainer');

            if (substitutions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>No substitution records found</p>
                    </div>
                `;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Absent Teacher</th>
                            <th>Substitute Teacher</th>
                            <th>Date</th>
                            <th>Day</th>
                            <th>Period</th>
                            <th>Class Name</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            substitutions.forEach(sub => {
                html += `
                    <tr>
                        <td>${sub.id}</td>
                        <td>${sub.absent_teacher_name}</td>
                        <td>${sub.substitute_teacher_name}</td>
                        <td>${sub.date}</td>
                        <td>${sub.day}</td>
                        <td>${sub.period}</td>
                        <td>${sub.class_name}</td>
                        <td>
                            <button class="btn btn-danger" onclick="deleteSubstitution(${sub.id})">Delete</button>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        // Handle assign substitute
        async function handleAssignSubstitute(e) {
            e.preventDefault();

            const absentTeacherId = document.getElementById('absentTeacher').value;
            const date = document.getElementById('date').value;
            const day = document.getElementById('day').value;
            const period = document.getElementById('period').value;

            try {
                const response = await fetch(`${API}/api/substitution/assign`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        absent_teacher_id: parseInt(absentTeacherId),
                        date,
                        day,
                        period: parseInt(period)
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Failed to assign substitute');
                }

                showAlert('Substitute assigned successfully', 'success');
                document.getElementById('substitutionForm').reset();
                loadSubstitutions();
            } catch (error) {
                showAlert(error.message || 'Error assigning substitute', 'error');
            }
        }

        // Delete substitution
        async function deleteSubstitution(id) {
            if (!confirm('Are you sure you want to delete this substitution?')) return;

            try {
                const response = await fetch(`${API}/api/substitution/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) throw new Error('Failed to delete substitution');

                showAlert('Substitution deleted successfully', 'success');
                loadSubstitutions();
            } catch (error) {
                showAlert('Error deleting substitution', 'error');
            }
        }

        // Show alert message
        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;

            container.innerHTML = '';
            container.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, 4000);
        }
    </script>
</body>
</html>
