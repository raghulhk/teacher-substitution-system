<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timetable Management - Teacher Substitution System</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      color: #333;
    }

    .container {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar Styles */
    .sidebar {
      width: 260px;
      background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
      padding: 30px 20px;
      color: white;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      box-shadow: 2px 0 15px rgba(102, 126, 234, 0.2);
    }

    .sidebar h2 {
      font-size: 28px;
      margin-bottom: 40px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .sidebar button {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 10px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
      text-align: left;
      border-left: 3px solid transparent;
    }

    .sidebar button:hover {
      background: rgba(255, 255, 255, 0.2);
      border-left-color: #fff;
      transform: translateX(5px);
    }

    /* Main Content */
    .main-content {
      margin-left: 260px;
      flex: 1;
      padding: 40px;
      overflow-y: auto;
    }

    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 32px;
      font-weight: 700;
    }

    .page-subtitle {
      color: #999;
      margin-bottom: 30px;
      font-size: 14px;
    }

    /* Form Card */
    .form-card {
      background: white;
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 40px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border-top: 4px solid #667eea;
      transition: all 0.3s ease;
    }

    .form-card:hover {
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }

    .form-card h2 {
      color: #333;
      margin-bottom: 25px;
      font-size: 20px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
      font-size: 14px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="time"],
    input[type="number"],
    select {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus,
    input[type="time"]:focus,
    input[type="number"]:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      background-color: #f9fafb;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-grid .form-group {
      margin-bottom: 0;
    }

    .form-full {
      grid-column: 1 / -1;
    }

    .form-actions {
      display: flex;
      gap: 15px;
      margin-top: 25px;
    }

    button.add-btn {
      flex: 1;
      padding: 12px 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button.add-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    button.add-btn:active {
      transform: translateY(0);
    }

    button.reset-btn {
      padding: 12px 30px;
      background: #f0f0f0;
      color: #333;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    button.reset-btn:hover {
      background: #e0e0e0;
    }

    #message {
      margin-top: 15px;
      padding: 12px 15px;
      border-radius: 8px;
      font-weight: 500;
      display: none;
      border-left: 4px solid;
      animation: slideIn 0.3s ease;
    }

    #message.success {
      background-color: #d4edda;
      color: #155724;
      border-left-color: #28a745;
      display: block;
    }

    #message.error {
      background-color: #f8d7da;
      color: #721c24;
      border-left-color: #f5c6cb;
      display: block;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Table Styles */
    .table-section {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow-x: auto;
    }

    .table-section h2 {
      color: #333;
      margin-bottom: 25px;
      font-size: 20px;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    table thead {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    table th {
      padding: 15px;
      text-align: left;
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    table td {
      padding: 15px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    table tbody tr {
      transition: all 0.2s ease;
    }

    table tbody tr:hover {
      background-color: #f9fafb;
      box-shadow: inset 0 0 0 1px rgba(102, 126, 234, 0.1);
    }

    table tbody tr:last-child td {
      border-bottom: none;
    }

    .delete-btn {
      padding: 8px 16px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .delete-btn:hover {
      background: #ff5252;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
    }

    .delete-btn:active {
      transform: translateY(0);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 15px;
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 16px;
      margin-bottom: 5px;
    }

    /* Loading State */
    .loading {
      text-align: center;
      padding: 40px;
      color: #667eea;
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Responsive Design */
    @media (max-width: 1024px) {
      .sidebar {
        width: 220px;
      }

      .main-content {
        margin-left: 220px;
        padding: 30px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: -260px;
        height: 100vh;
        z-index: 1000;
        width: 260px;
        transition: left 0.3s ease;
      }

      .sidebar.active {
        left: 0;
      }

      .main-content {
        margin-left: 0;
        padding: 20px;
      }

      .menu-toggle {
        display: block;
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 999;
        background: #667eea;
        border: none;
        color: white;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 24px;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
      }

      h1 {
        font-size: 24px;
      }

      .form-card,
      .table-section {
        padding: 20px;
      }

      table th,
      table td {
        padding: 10px;
        font-size: 12px;
      }

      .form-actions {
        flex-direction: column;
      }

      button.add-btn,
      button.reset-btn {
        width: 100%;
      }

      .delete-btn {
        padding: 6px 12px;
        font-size: 11px;
      }
    }

    @media (max-width: 480px) {
      .table-section {
        padding: 15px;
      }

      table {
        font-size: 12px;
      }

      table th,
      table td {
        padding: 8px 5px;
      }

      h1 {
        font-size: 20px;
      }

      .form-card h2,
      .table-section h2 {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="sidebar" id="sidebar">
    <h2>TSS</h2>
    <button onclick="navigateTo('/dashboard.html')">Dashboard</button>
    <button onclick="navigateTo('/teachers.html')">Teachers</button>
    <button onclick="navigateTo('/timetable.html')">Timetable</button>
    <button onclick="navigateTo('/substitutions.html')">Substitutions</button>
    <button onclick="navigateTo('/reports.html')">Reports</button>
  </div>

  <div class="main-content">
    <h1>Timetable Management</h1>
    <p class="page-subtitle">Create and manage class schedules for teachers</p>

    <div class="form-card">
      <h2>Add New Timetable Entry</h2>
      
      <div class="form-grid">
        <div class="form-group">
          <label for="teacher">Teacher Name</label>
          <select id="teacher">
            <option value="">Select a teacher</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="subject">Subject</label>
          <input id="subject" type="text" placeholder="e.g., Mathematics">
        </div>

        <div class="form-group">
          <label for="day">Day</label>
          <select id="day">
            <option value="">Select a day</option>
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="startTime">Start Time</label>
          <input id="startTime" type="time">
        </div>

        <div class="form-group">
          <label for="endTime">End Time</label>
          <input id="endTime" type="time">
        </div>

        <div class="form-group">
          <label for="room">Class Room</label>
          <input id="room" type="text" placeholder="e.g., A-101">
        </div>
      </div>

      <div class="form-actions">
        <button class="add-btn" onclick="addTimetable()">Add Timetable</button>
        <button class="reset-btn" onclick="resetForm()">Clear Form</button>
      </div>

      <div id="message"></div>
    </div>

    <div class="table-section">
      <h2>Timetable List</h2>
      
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Teacher</th>
            <th>Subject</th>
            <th>Day</th>
            <th>Start Time</th>
            <th>End Time</th>
            <th>Room</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="timetableTable">
          <tr>
            <td colspan="8" class="loading"><div class="spinner"></div> Loading timetables...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

  <script>
    const API = "http://localhost:3000";

    function getToken() {
      return localStorage.getItem("token");
    }

    function navigateTo(path) {
      window.location.href = path;
    }

    function resetForm() {
      document.getElementById("teacher").value = "";
      document.getElementById("subject").value = "";
      document.getElementById("day").value = "";
      document.getElementById("startTime").value = "";
      document.getElementById("endTime").value = "";
      document.getElementById("room").value = "";
      document.getElementById("message").innerHTML = "";
      document.getElementById("message").className = "";
    }

    function showMessage(text, type) {
      const message = document.getElementById("message");
      message.innerText = text;
      message.className = type;
      
      if (type === "success") {
        setTimeout(() => {
          message.innerHTML = "";
          message.className = "";
        }, 4000);
      }
    }

    async function loadTeachers() {
      try {
        const response = await fetch(`${API}/api/teachers`);
        const teachers = await response.json();

        const teacherSelect = document.getElementById("teacher");
        teachers.forEach((teacher) => {
          const option = document.createElement("option");
          option.value = teacher.id;
          option.textContent = teacher.name;
          teacherSelect.appendChild(option);
        });
      } catch (error) {
        console.error("[v0] Error loading teachers:", error);
      }
    }

    async function loadTimetables() {
      try {
        const response = await fetch(`${API}/api/timetable`);
        const timetables = await response.json();

        const table = document.getElementById("timetableTable");
        
        if (!timetables || timetables.length === 0) {
          table.innerHTML = `
            <tr>
              <td colspan="8" class="empty-state">
                <div class="empty-state-icon">📅</div>
                <p>No timetables found</p>
                <p style="font-size: 12px;">Add your first timetable entry using the form above</p>
              </td>
            </tr>
          `;
          return;
        }

        table.innerHTML = "";
        timetables.forEach((timetable) => {
          table.innerHTML += `
            <tr>
              <td>${timetable.id}</td>
              <td>${timetable.teacherName || "-"}</td>
              <td>${timetable.subject || "-"}</td>
              <td>${timetable.day || "-"}</td>
              <td>${timetable.startTime || "-"}</td>
              <td>${timetable.endTime || "-"}</td>
              <td>${timetable.room || "-"}</td>
              <td>
                <button class="delete-btn" onclick="deleteTimetable(${timetable.id})">
                  Delete
                </button>
              </td>
            </tr>
          `;
        });
      } catch (error) {
        console.error("[v0] Error loading timetables:", error);
        document.getElementById("timetableTable").innerHTML = `
          <tr>
            <td colspan="8" class="empty-state">
              <div class="empty-state-icon">⚠️</div>
              <p>Error loading timetables</p>
              <p style="font-size: 12px;">Please try again later</p>
            </td>
          </tr>
        `;
      }
    }

    async function addTimetable() {
      const teacherId = document.getElementById("teacher").value;
      const subject = document.getElementById("subject").value.trim();
      const day = document.getElementById("day").value;
      const startTime = document.getElementById("startTime").value;
      const endTime = document.getElementById("endTime").value;
      const room = document.getElementById("room").value.trim();

      if (!teacherId || !subject || !day || !startTime || !endTime || !room) {
        showMessage("Please fill in all required fields", "error");
        return;
      }

      const timetable = {
        teacherId,
        subject,
        day,
        startTime,
        endTime,
        room,
      };

      try {
        const response = await fetch(`${API}/api/timetable`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${getToken()}`,
          },
          body: JSON.stringify(timetable),
        });

        const data = await response.json();

        if (response.ok) {
          showMessage(data.message || "Timetable added successfully!", "success");
          resetForm();
          loadTimetables();
        } else {
          showMessage(data.message || "Error adding timetable", "error");
        }
      } catch (error) {
        console.error("[v0] Error adding timetable:", error);
        showMessage("An error occurred. Please try again.", "error");
      }
    }

    async function deleteTimetable(id) {
      const confirmDelete = confirm("Are you sure you want to delete this timetable entry?");
      if (!confirmDelete) return;

      try {
        const response = await fetch(`${API}/api/timetable/${id}`, {
          method: "DELETE",
          headers: {
            Authorization: `Bearer ${getToken()}`,
          },
        });

        const data = await response.json();
        
        if (response.ok) {
          showMessage(data.message || "Timetable deleted successfully!", "success");
        } else {
          alert(data.message || "Error deleting timetable");
        }

        loadTimetables();
      } catch (error) {
        console.error("[v0] Error deleting timetable:", error);
        alert("An error occurred while deleting the timetable.");
      }
    }

    // Load data on page load
    loadTeachers();
    loadTimetables();
  </script>
</body>
</html>
