<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable Management - Teacher Substitution System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 0 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .nav-brand {
            font-size: 24px;
            font-weight: 700;
            color: white;
            text-decoration: none;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 30px;
            align-items: center;
        }

        .nav-menu a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 8px 12px;
            border-radius: 6px;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            color: white;
            background: rgba(255, 255, 255, 0.15);
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* Main Content */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-top: 4px solid #667eea;
        }

        .header h1 {
            color: #2d3561;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            color: #a0a9d1;
            font-size: 14px;
        }

        /* Card */
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-top: 4px solid #667eea;
        }

        .card h2 {
            color: #2d3561;
            margin-bottom: 20px;
            font-size: 20px;
        }

        /* Form Styles */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: #2d3561;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-start;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #2d3561;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .btn-danger {
            padding: 8px 16px;
            background: #ff6b6b;
            color: white;
            font-size: 12px;
        }

        .btn-danger:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }

        .btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Message */
        .alert {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Table */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
            color: #555;
        }

        tbody tr:hover {
            background: #f5f5f5;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .empty-state p {
            margin: 5px 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-menu {
                gap: 15px;
            }

            .nav-menu a {
                font-size: 13px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 10px;
            }
        }

        @media (max-width: 480px) {
            .nav-container {
                gap: 15px;
            }

            .nav-brand {
                font-size: 18px;
            }

            .nav-menu {
                gap: 10px;
                font-size: 12px;
            }

            .nav-menu a {
                padding: 6px 8px;
            }

            .container {
                padding: 15px 10px;
            }

            .header, .card {
                padding: 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .card h2 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="dashboard.html" class="nav-brand">TSM System</a>
            <ul class="nav-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="teachers.html">Teachers</a></li>
                <li><a href="timetable.html" class="active">Timetable</a></li>
                <li><a href="substitution.html">Substitutions</a></li>
                <li><a href="reports.html">Reports</a></li>
                <li><button class="logout-btn" onclick="logout()">Logout</button></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Timetable Management</h1>
            <p>Add and manage timetable entries for classes and teachers</p>
        </div>

        <!-- Messages -->
        <div id="successMessage" class="alert alert-success"></div>
        <div id="errorMessage" class="alert alert-error"></div>

        <!-- Add Timetable Form -->
        <div class="card">
            <h2>Add New Timetable Entry</h2>
            <form id="timetableForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="teacher">Teacher *</label>
                        <select id="teacher" required>
                            <option value="">Select teacher</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject *</label>
                        <input type="text" id="subject" placeholder="e.g., Python, Mathematics" required>
                    </div>

                    <div class="form-group">
                        <label for="day">Day *</label>
                        <select id="day" required>
                            <option value="">Select day</option>
                            <option value="Monday">Monday</option>
                            <option value="Tuesday">Tuesday</option>
                            <option value="Wednesday">Wednesday</option>
                            <option value="Thursday">Thursday</option>
                            <option value="Friday">Friday</option>
                            <option value="Saturday">Saturday</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="period">Period Number *</label>
                        <input type="number" id="period" placeholder="1-6" min="1" max="6" required>
                    </div>

                    <div class="form-group">
                        <label for="className">Class Name *</label>
                        <input type="text" id="className" placeholder="e.g., BCA-A" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">Add Entry</button>
                    <button type="reset" class="btn btn-secondary">Clear Form</button>
                </div>
            </form>
        </div>

        <!-- Timetable List -->
        <div class="card">
            <h2>Timetable Entries</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Teacher</th>
                            <th>Subject</th>
                            <th>Day</th>
                            <th>Period</th>
                            <th>Class Name</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="timetableTable">
                        <tr>
                            <td colspan="7" class="empty-state">
                                <div class="empty-state-icon">📚</div>
                                <p>Loading timetable...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API = "";

        // Check token on page load
        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("token");
            if (!token) {
                window.location.href = "index.html";
                return;
            }

            loadTeachers();
            loadTimetable();
            setupFormListener();
        });

        // Setup form listener
        function setupFormListener() {
            document.getElementById("timetableForm").addEventListener("submit", (e) => {
                e.preventDefault();
                addTimetableEntry();
            });
        }

        // Load all teachers for dropdown
        async function loadTeachers() {
            try {
                const response = await fetch(`${API}/api/teachers`);
                const teachers = await response.json();

                const teacherSelect = document.getElementById("teacher");
                teacherSelect.innerHTML = '<option value="">Select teacher</option>';

                if (teachers && teachers.length > 0) {
                    teachers.forEach((teacher) => {
                        const option = document.createElement("option");
                        option.value = teacher.id;
                        option.textContent = teacher.name;
                        teacherSelect.appendChild(option);
                    });
                }
            } catch (error) {
                console.error("[v0] Error loading teachers:", error);
                showError("Error loading teachers");
            }
        }

        // Load all timetable entries
        async function loadTimetable() {
            try {
                const response = await fetch(`${API}/api/timetable`);
                const timetables = await response.json();

                const table = document.getElementById("timetableTable");

                if (!timetables || timetables.length === 0) {
                    table.innerHTML = `
                        <tr>
                            <td colspan="7" class="empty-state">
                                <div class="empty-state-icon">📋</div>
                                <p>No timetable entries found</p>
                                <p style="font-size: 12px;">Add your first entry using the form above</p>
                            </td>
                        </tr>
                    `;
                    return;
                }

                table.innerHTML = "";
                timetables.forEach((entry) => {
                    table.innerHTML += `
                        <tr>
                            <td>${entry.id}</td>
                            <td>${entry.teacher_name || "-"}</td>
                            <td>${entry.subject || "-"}</td>
                            <td>${entry.day || "-"}</td>
                            <td>${entry.period || "-"}</td>
                            <td>${entry.class_name || "-"}</td>
                            <td>
                                <button class="btn btn-danger" onclick="deleteTimetableEntry(${entry.id})">
                                    Delete
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("[v0] Error loading timetable:", error);
                document.getElementById("timetableTable").innerHTML = `
                    <tr>
                        <td colspan="7" class="empty-state">
                            <div class="empty-state-icon">⚠️</div>
                            <p>Error loading timetable</p>
                            <p style="font-size: 12px;">Please try again later</p>
                        </td>
                    </tr>
                `;
            }
        }

        // Add new timetable entry
        async function addTimetableEntry() {
            const teacherId = document.getElementById("teacher").value;
            const subject = document.getElementById("subject").value.trim();
            const day = document.getElementById("day").value;
            const period = document.getElementById("period").value;
            const className = document.getElementById("className").value.trim();

            // Validation
            if (!teacherId || !subject || !day || !period || !className) {
                showError("All fields are required");
                return;
            }

            if (period < 1 || period > 6) {
                showError("Period must be between 1 and 6");
                return;
            }

            const submitBtn = document.getElementById("submitBtn");
            submitBtn.classList.add("loading");
            submitBtn.innerHTML = '<span class="spinner"></span>Adding...';
            submitBtn.disabled = true;

            try {
                const token = localStorage.getItem("token");
                const response = await fetch(`${API}/api/timetable`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`,
                    },
                    body: JSON.stringify({
                        teacher_id: parseInt(teacherId),
                        subject: subject,
                        day: day,
                        period: parseInt(period),
                        class_name: className,
                    }),
                });

                if (!response.ok) {
                    throw new Error("Failed to add timetable entry");
                }

                showSuccess("Timetable entry added successfully");
                document.getElementById("timetableForm").reset();
                loadTimetable();
            } catch (error) {
                console.error("[v0] Error adding timetable entry:", error);
                showError("Error adding timetable entry");
            } finally {
                submitBtn.classList.remove("loading");
                submitBtn.innerHTML = "Add Entry";
                submitBtn.disabled = false;
            }
        }

        // Delete timetable entry
        async function deleteTimetableEntry(id) {
            if (!confirm("Are you sure you want to delete this timetable entry?")) {
                return;
            }

            try {
                const token = localStorage.getItem("token");
                const response = await fetch(`${API}/api/timetable/${id}`, {
                    method: "DELETE",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                    },
                });

                if (!response.ok) {
                    throw new Error("Failed to delete timetable entry");
                }

                showSuccess("Timetable entry deleted successfully");
                loadTimetable();
            } catch (error) {
                console.error("[v0] Error deleting timetable entry:", error);
                showError("Error deleting timetable entry");
            }
        }

        // Show success message
        function showSuccess(message) {
            const successDiv = document.getElementById("successMessage");
            successDiv.textContent = message;
            successDiv.classList.add("show");

            setTimeout(() => {
                successDiv.classList.remove("show");
            }, 4000);
        }

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById("errorMessage");
            errorDiv.textContent = message;
            errorDiv.classList.add("show");

            setTimeout(() => {
                errorDiv.classList.remove("show");
            }, 4000);
        }

        // Logout function
        function logout() {
            localStorage.removeItem("token");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
