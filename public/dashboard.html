<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Teacher Substitution System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
        }

        /* Navbar Styles */
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
        }

        .navbar-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 700;
            text-decoration: none;
            color: white;
        }

        .navbar-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .navbar-menu {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Page Header */
        .page-header {
            margin-bottom: 40px;
        }

        .page-header h1 {
            font-size: 32px;
            color: #2d3561;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .page-header p {
            color: #a0a9d1;
            font-size: 15px;
        }

        /* Stats Cards Grid */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .card:hover {
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.15);
            transform: translateY(-5px);
        }

        .card-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .card h2 {
            font-size: 42px;
            color: #667eea;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .card p {
            color: #a0a9d1;
            font-size: 15px;
            margin: 0;
            font-weight: 500;
        }

        /* Menu Buttons Grid */
        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 30px;
        }

        .menu-btn {
            padding: 18px;
            border: 2px solid transparent;
            background: white;
            color: #2d3561;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-decoration: none;
            display: inline-block;
            text-align: center;
            border: 1px solid #e0e0e0;
        }

        .menu-btn:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.25);
            transform: translateY(-3px);
        }

        .menu-btn:active {
            transform: translateY(-1px);
        }

        /* Loading State */
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar-container {
                padding: 12px 15px;
                flex-wrap: wrap;
            }

            .navbar-brand {
                font-size: 18px;
                gap: 8px;
            }

            .navbar-icon {
                width: 35px;
                height: 35px;
                font-size: 18px;
            }

            .navbar-menu {
                gap: 10px;
                width: 100%;
                margin-top: 12px;
            }

            .nav-link {
                font-size: 12px;
                padding: 6px 12px;
            }

            .logout-btn {
                padding: 6px 12px;
                font-size: 12px;
            }

            .container {
                margin: 30px auto;
            }

            .page-header h1 {
                font-size: 26px;
            }

            .cards {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .card {
                padding: 20px;
            }

            .card h2 {
                font-size: 32px;
            }

            .menu {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 12px;
            }

            .menu-btn {
                padding: 14px;
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .navbar-container {
                padding: 10px 12px;
            }

            .navbar-brand {
                font-size: 16px;
            }

            .navbar-icon {
                width: 30px;
                height: 30px;
                font-size: 16px;
            }

            .container {
                margin: 20px auto;
                padding: 0 12px;
            }

            .page-header h1 {
                font-size: 22px;
            }

            .card {
                padding: 15px;
            }

            .card h2 {
                font-size: 28px;
            }

            .menu {
                gap: 10px;
            }

            .menu-btn {
                padding: 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="dashboard.html" class="navbar-brand">
                <div class="navbar-icon">👨‍🏫</div>
                <span>TSM Dashboard</span>
            </a>
            <div class="navbar-menu">
                <a href="teachers.html" class="nav-link">Teachers</a>
                <a href="timetable.html" class="nav-link">Timetable</a>
                <a href="substitution.html" class="nav-link">Substitutions</a>
                <a href="reports.html" class="nav-link">Reports</a>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <!-- Page Header -->
        <div class="page-header">
            <h1>Dashboard</h1>
            <p>Overview of your Teacher Substitution System</p>
        </div>

        <!-- Statistics Cards -->
        <div class="cards">
            <div class="card">
                <div class="card-icon">👨‍💼</div>
                <h2 id="teacherCount">0</h2>
                <p>Total Teachers</p>
            </div>

            <div class="card">
                <div class="card-icon">📅</div>
                <h2 id="timetableCount">0</h2>
                <p>Total Timetable Entries</p>
            </div>

            <div class="card">
                <div class="card-icon">🔄</div>
                <h2 id="substitutionCount">0</h2>
                <p>Total Substitutions</p>
            </div>
        </div>

        <!-- Menu Buttons -->
        <div class="menu">
            <button class="menu-btn" onclick="location.href='teachers.html'">
                Manage Teachers
            </button>

            <button class="menu-btn" onclick="location.href='timetable.html'">
                Manage Timetable
            </button>

            <button class="menu-btn" onclick="location.href='substitution.html'">
                Handle Substitutions
            </button>

            <button class="menu-btn" onclick="location.href='reports.html'">
                View Reports
            </button>
        </div>
    </div>

    <script>
        const API = "";

        // Check authentication
        if (!localStorage.getItem("token")) {
            window.location.href = "/index.html";
        }

        // Load dashboard data
        async function loadDashboard() {
            try {
                const [teachersRes, timetableRes, substitutionsRes] = await Promise.all([
                    fetch(`${API}/api/teachers`),
                    fetch(`${API}/api/timetable`),
                    fetch(`${API}/api/substitution`),
                ]);

                const teacherData = await teachersRes.json();
                const timetableData = await timetableRes.json();
                const substitutionData = await substitutionsRes.json();

                document.getElementById("teacherCount").innerText = teacherData.length || 0;
                document.getElementById("timetableCount").innerText = timetableData.length || 0;
                document.getElementById("substitutionCount").innerText = substitutionData.length || 0;
            } catch (err) {
                console.error("[v0] Error loading dashboard:", err);
                alert("Failed to load dashboard data");
            }
        }

        // Logout function
        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("rememberUsername");
            window.location.href = "index.html";
        }

        // Load data on page load
        loadDashboard();
    </script>
</body>
</html>
