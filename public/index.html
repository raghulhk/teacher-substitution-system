<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Substitution System - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
        }

        /* Animated background elements */
        .background-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .shape {
            position: absolute;
            opacity: 0.1;
        }

        .shape1 {
            width: 300px;
            height: 300px;
            background: white;
            border-radius: 50%;
            top: -100px;
            left: -100px;
            animation: float 6s ease-in-out infinite;
        }

        .shape2 {
            width: 200px;
            height: 200px;
            background: white;
            border-radius: 50%;
            bottom: -50px;
            right: -50px;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(20px); }
        }

        /* Login Container */
        .container {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        h1 {
            font-size: 28px;
            color: #2d3561;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .subtitle {
            color: #a0a9d1;
            font-size: 14px;
            margin: 0;
            font-weight: 500;
        }

        /* Form Group */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2d3561;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            font-size: 18px;
        }

        input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
            color: #2d3561;
        }

        input::placeholder {
            color: #b0b8d4;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            background: rgba(102, 126, 234, 0.02);
        }

        input.error {
            border-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.02);
        }

        /* Remember Me */
        .form-group-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        input[type="checkbox"] {
            width: auto;
            padding: 0;
            margin: 0;
            cursor: pointer;
            accent-color: #667eea;
        }

        .checkbox-label {
            color: #666;
            font-size: 14px;
            margin: 0;
            cursor: pointer;
        }

        /* Button */
        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Message */
        .message-box {
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            font-weight: 500;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-box.show {
            display: block;
        }

        .message-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #e0e0e0;
            color: #999;
            font-size: 13px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-box {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .logo-icon {
                width: 50px;
                height: 50px;
                font-size: 28px;
            }

            input {
                padding: 12px 12px 12px 40px;
                font-size: 14px;
            }

            .login-btn {
                padding: 12px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="background-shapes">
        <div class="shape shape1"></div>
        <div class="shape shape2"></div>
    </div>

    <!-- Login Container -->
    <div class="container">
        <div class="login-wrapper">
            <div class="login-box">
                <!-- Header -->
                <div class="login-header">
                    <div class="logo-icon">👨‍🏫</div>
                    <h1>Teacher Substitution</h1>
                    <p class="subtitle">Admin Portal Login</p>
                </div>

                <!-- Form -->
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <!-- Username Field -->
                    <div class="form-group">
                        <label for="username">Username</label>
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input 
                                type="text" 
                                id="username" 
                                placeholder="Enter your username"
                                autocomplete="off"
                                required
                            >
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input 
                                type="password" 
                                id="password" 
                                placeholder="Enter your password"
                                autocomplete="off"
                                required
                            >
                        </div>
                    </div>

                    <!-- Remember Me -->
                    <div class="form-group-checkbox">
                        <input type="checkbox" id="remember">
                        <label for="remember" class="checkbox-label">Remember me</label>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="login-btn" id="loginBtn">
                        <span id="btnText">Login</span>
                    </button>

                    <!-- Message Box -->
                    <div id="message" class="message-box"></div>
                </form>

                <!-- Footer -->
                <div class="login-footer">
                    <p>© 2026 Teacher Substitution System. All rights reserved.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = "";

        // Handle form submission
        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const loginBtn = document.getElementById("loginBtn");
            const btnText = document.getElementById("btnText");
            const messageBox = document.getElementById("message");

            // Validation
            if (!username || !password) {
                showMessage("Please fill in all fields", "error");
                return;
            }

            if (username.length < 3) {
                showMessage("Username must be at least 3 characters", "error");
                addErrorClass("username");
                return;
            }

            if (password.length < 4) {
                showMessage("Password must be at least 4 characters", "error");
                addErrorClass("password");
                return;
            }

            // Show loading state
            loginBtn.classList.add("loading");
            btnText.innerHTML = '<span class="spinner"></span>Logging in...';
            loginBtn.disabled = true;

            try {
                const response = await fetch(`${API}/api/auth/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                    }),
                });

                const data = await response.json();

                if (response.ok) {
                    // Store token
                    localStorage.setItem("token", data.token);
                    
                    // Store remember me preference
                    if (document.getElementById("remember").checked) {
                        localStorage.setItem("rememberUsername", username);
                    } else {
                        localStorage.removeItem("rememberUsername");
                    }

                    // Show success message
                    showMessage("Login successful! Redirecting...", "success");

                    // Redirect after short delay
                    setTimeout(() => {
                        window.location.href = "/dashboard.html";
                    }, 1000);
                } else {
                    // Show error message
                    showMessage(data.message || "Login failed. Please try again.", "error");
                    
                    // Reset button
                    loginBtn.classList.remove("loading");
                    btnText.textContent = "Login";
                    loginBtn.disabled = false;
                }
            } catch (error) {
                console.error("[v0] Login error:", error);
                showMessage("Connection error. Please try again.", "error");
                
                // Reset button
                loginBtn.classList.remove("loading");
                btnText.textContent = "Login";
                loginBtn.disabled = false;
            }
        }

        // Show message function
        function showMessage(text, type) {
            const messageBox = document.getElementById("message");
            messageBox.textContent = text;
            messageBox.className = `message-box show message-${type}`;

            // Auto-hide success messages
            if (type === "success") {
                setTimeout(() => {
                    messageBox.classList.remove("show");
                }, 3000);
            }
        }

        // Add error class to input
        function addErrorClass(fieldId) {
            const field = document.getElementById(fieldId);
            field.classList.add("error");

            // Remove error class on input
            field.addEventListener("input", function () {
                this.classList.remove("error");
            }, { once: true });
        }

        // Load remembered username
        document.addEventListener("DOMContentLoaded", () => {
            const rememberedUsername = localStorage.getItem("rememberUsername");
            if (rememberedUsername) {
                document.getElementById("username").value = rememberedUsername;
                document.getElementById("remember").checked = true;
                document.getElementById("password").focus();
            }
        });

        // Enter key to submit form
        document.getElementById("loginForm").addEventListener("keypress", (event) => {
            if (event.key === "Enter") {
                handleLogin(event);
            }
        });

        // Remove error styling on input
        document.getElementById("username").addEventListener("input", function () {
            this.classList.remove("error");
        });

        document.getElementById("password").addEventListener("input", function () {
            this.classList.remove("error");
        });
    </script>
</body>
</html>
